- id: robovlms
  name: RoboVLMs
  org: Tsinghua University / ByteDance Research / CASIA / SJTU / NUS
  year: 2024
  description_en: A systematic study of how to build VLAs from VLMs, answering three
    design questions (which VLM backbone to use, how to formulate the VLA architecture,
    and when to add cross-embodiment data) through 600+ experiments across 8+ VLM
    backbones and 4 policy architectures. The findings are released as RoboVLMs, a
    flexible open-source framework for easily integrating new VLMs and freely combining
    design choices.
  description_ko: VLM으로 VLA를 만들 때 어떤 백본을 쓸지, VLA 구조를 어떻게 구성할지, 이기종 로봇(cross-embodiment)
    데이터를 언제 추가할지라는 세 가지 설계 질문을 8개 이상의 VLM 백본과 4가지 정책 구조, 600여 개 실험으로 체계적으로 분석한 연구.
    그 결과를 새 VLM을 쉽게 통합하고 설계 요소를 자유롭게 조합할 수 있는 오픈소스 프레임워크 RoboVLMs로 공개했습니다.
