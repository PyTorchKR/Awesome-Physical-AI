- id: pi0
  name: π0 (pi-zero)
  org: Physical Intelligence
  year: 2024
  description_en: A VLA that attaches a separate flow-matching "action expert" to
    a pretrained vision-language model (PaliGemma), generating continuous action chunks
    at up to 50 Hz for dexterous control. It is broadly pre-trained on diverse data
    from 7 robot configurations (single-arm, dual-arm and mobile manipulators), then
    post-trained on high-quality curated data for complex multi-stage tasks such as
    laundry folding.
  description_ko: 사전학습된 비전-언어 모델(PaliGemma)에 별도의 flow-matching "action expert"를 붙여
    최대 50Hz의 연속 행동 청크를 생성하는 VLA. 7가지 로봇 구성(단일 팔·양팔·모바일 매니퓰레이터)의 다양한 데이터로 폭넓게 사전학습한
    뒤, 고품질 정제 데이터로 사후학습해 빨래 개기 같은 복잡한 다단계 작업을 수행하도록 하는 2단계 학습 방식을 제시했습니다.
