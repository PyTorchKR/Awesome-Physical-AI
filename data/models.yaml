- id: rdt-1b
  name: RDT-1B
  org: Tsinghua University
  year: 2024
  description_en: RDT-1B is a 1.2B-parameter diffusion foundation model for bimanual
    manipulation. Its key contributions are a Physically Interpretable Unified Action
    Space that lets it pre-train on 1M+ episodes across 46 heterogeneous multi-robot
    datasets, and a scalable Transformer architecture that successfully scales diffusion-based
    robot policies to the billion-parameter range. Fine-tuned on 6K+ ALOHA dual-arm
    episodes, it achieves zero-shot generalization to unseen objects/scenes, follows
    language instructions, and learns new skills from just 1~5 demonstrations.
  description_ko: RDT-1B는 양팔 조작을 위한 12억 파라미터 규모의 디퓨전 파운데이션 모델입니다. 핵심 기여는 물리적 의미를 보존하면서
    이기종 로봇 간 액션 표현을 통일한 "Physically Interpretable Unified Action Space"로, 이를 통해 46개
    멀티로봇 데이터셋의 100만 개 이상 에피소드를 하나의 모델로 사전학습할 수 있었습니다. 또한 고빈도·비선형적인 로봇 액션 데이터에 맞춘 확장
    가능한 Transformer 설계로 디퓨전 기반 로봇 정책을 10억 파라미터 규모까지 안정적으로 스케일업한 점도 주요 성과입니다. ALOHA
    듀얼암 로봇의 6천여 개 에피소드로 파인튜닝하여 미지의 물체/장면에 대한 제로샷 일반화, 언어 지시 이해, 1~5개 시연만으로 새 스킬 학습이
    가능함을 보였습니다.
