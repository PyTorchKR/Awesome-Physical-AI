- id: mobile-aloha
  name: Mobile ALOHA
  org: Stanford
  year: 2024
  description_en: A low-cost bimanual mobile manipulation system that adds a mobile
    base and a whole-body teleoperation interface to the stationary ALOHA. It shows
    that co-training the new mobile-task demonstrations (50 per task) together with
    previously collected static ALOHA data from other tasks substantially raises success
    rates, enabling autonomous household chores such as cooking and storing pots as
    well as mobile tasks like calling and entering an elevator.
  description_ko: 고정형 ALOHA에 모바일 베이스와 전신 원격조종 인터페이스를 더한 저가형 양팔 모바일 매니퓰레이션 시스템. 새로
    수집한 모바일 태스크 시연(태스크당 50개)에, 이전에 고정형 ALOHA로 수집된 다른 태스크 데이터를 함께 섞어 학습(co-training)하면
    성공률이 크게 오른다는 것을 보였습니다. 이를 통해 요리·냄비 수납 같은 가사 작업과 엘리베이터 호출·탑승 같은 이동 작업을 자율로 수행합니다.
  github_url: https://github.com/MarkFzp/mobile-aloha
