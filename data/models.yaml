- id: act
  name: ACT (Action Chunking with Transformers)
  org: Stanford / UC Berkeley / Meta
  year: 2023
  description_en: An imitation learning method that predicts chunks of future actions
    with a CVAE-trained transformer to reduce the compounding errors of single-step
    policies, and smooths execution with temporal ensembling over overlapping chunks.
    Developed on the ALOHA system, it learns fine-grained bimanual manipulation from
    about 50 demonstrations.
  description_ko: CVAE로 학습한 트랜스포머가 미래 행동을 묶음(action chunk) 단위로 예측해 단일 스텝 정책의 누적 오차를
    줄이고, 겹치는 청크를 평균하는 temporal ensembling으로 동작을 부드럽게 만드는 모방학습 방법. ALOHA 시스템을 기반으로
    연구되었으며, 약 50개 시연만으로 정밀한 양팔 조작을 학습합니다.
  github_url: https://github.com/tonyzhaozh/act
