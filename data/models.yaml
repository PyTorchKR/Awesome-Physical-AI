- id: lerobot
  name: LeRobot
  org: Hugging Face
  year: 2024
  description_en: An open-source PyTorch library from Hugging Face that integrates
    the whole robot learning stack, from a unified hardware API (SO-100 arms to humanoids)
    and the LeRobotDataset format to an asynchronous inference stack. It also provides
    IL, RL and VLA policy implementations (e.g., ACT, Pi0, SmolVLA) with pretrained
    models.
