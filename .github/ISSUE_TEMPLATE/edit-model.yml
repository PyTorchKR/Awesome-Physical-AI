name: "Edit a Model"
description: "Fix or update information for an already-listed model"
title: "[Edit Model] "
labels: ["edit-model"]
body:
  - type: markdown
    attributes:
      value: |
        ## 모델 정보 수정 | Edit an Existing Model
        등록된 모델의 잘못된 정보를 수정합니다. 이슈 등록 후 봇이 자동으로 PR을 생성합니다.

        Fix incorrect information for a listed model. A bot will create a PR automatically.

  - type: dropdown
    id: id
    attributes:
      label: "ID (slug)"
      description: "수정할 모델을 선택하세요 | Select the model you want to fix"
      options:
        # AUTOGEN:models:start
        - "lerobot — LeRobot"
        - "pi0 — π0 (pi-zero)"
        - "openvla — OpenVLA"
        - "octo — Octo"
        - "act — ACT (Action Chunking with Transformers)"
        - "diffusion-policy — Diffusion Policy"
        - "mobile-aloha — Mobile ALOHA"
        - "humanplus — HumanPlus"
        - "groot — GR00T N1"
        - "roboflamingo — RoboFlamingo"
        - "gr1 — GR-1"
        - "crossformer — CrossFormer"
        - "robovlms — RoboVLMs"
        - "cogact — CogACT"
        - "dial — DIAL"
        # AUTOGEN:models:end
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "Reason for edit"
      description: "무엇이 왜 잘못되었는지 설명해 주세요 | Explain what is wrong and why"
      placeholder: "e.g. The organization is listed as X but should be Y; the paper URL returns 404."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 수정할 값 | Updated values

        **바꾸려는 항목만** 채워 주세요. 비워 둔 항목은 기존 값이 그대로 유지됩니다.
        체크박스 그룹은 **하나라도 체크하면 그 그룹 전체가 체크한 값으로 교체**되고,
        아무것도 체크하지 않으면 기존 값이 유지됩니다.

        Fill in **only what should change** — anything left blank keeps its current value.
        For checkbox groups, checking at least one box replaces that entire list;
        leaving a group untouched keeps its current values.

  - type: input
    id: name
    attributes:
      label: "Name"
      placeholder: "Corrected official model name"

  - type: input
    id: organization
    attributes:
      label: "Organization"
      placeholder: "e.g. Physical Intelligence"

  - type: input
    id: year
    attributes:
      label: "Year"
      placeholder: "e.g. 2024"

  - type: textarea
    id: description_en
    attributes:
      label: "Description (English)"
      placeholder: "Corrected 1-2 sentence description"

  - type: textarea
    id: description_ko
    attributes:
      label: "Description (Korean)"
      placeholder: "수정된 1-2 문장 설명"

  - type: input
    id: github_url
    attributes:
      label: "GitHub URL"
      placeholder: "https://github.com/org/repo"

  - type: input
    id: paper_url
    attributes:
      label: "Paper URL (arXiv)"
      placeholder: "https://arxiv.org/abs/xxxx.xxxxx"

  - type: input
    id: huggingface_url
    attributes:
      label: "HuggingFace URL"
      placeholder: "https://huggingface.co/org/model"

  - type: input
    id: project_page_url
    attributes:
      label: "Project Page URL"
      placeholder: "https://mymodel.github.io"

  - type: checkboxes
    id: categories
    attributes:
      label: "Categories"
      description: "체크하면 categories 전체를 교체 | Checking any box replaces the whole list"
      options:
        - label: "manipulation"
        - label: "locomotion"
        - label: "navigation"
        - label: "dexterous"
        - label: "whole-body"
        - label: "aerial"
        - label: "underwater"

  - type: checkboxes
    id: hardware_targets
    attributes:
      label: "Hardware Targets"
      description: "체크하면 hardware 전체를 교체 | Checking any box replaces the whole list"
      options:
        - label: "manipulator"
        - label: "humanoid"
        - label: "quadruped"
        - label: "biped"
        - label: "mobile"
        - label: "drone"
        - label: "underwater"
        - label: "hand"

  - type: checkboxes
    id: learning_methods
    attributes:
      label: "Learning Methods"
      description: "체크하면 learning 전체를 교체 | Checking any box replaces the whole list"
      options:
        - label: "VLA"
        - label: "IL"
        - label: "RL"
        - label: "diffusion"
        - label: "world_model"
        - label: "sim2real"
        - label: "meta-learning"
        - label: "self-supervised"

  - type: checkboxes
    id: framework
    attributes:
      label: "Framework"
      description: "체크하면 framework 전체를 교체 | Checking any box replaces the whole list"
      options:
        - label: "pytorch"
        - label: "jax"
        - label: "tensorflow"
        - label: "mujoco"
        - label: "isaacgym"
        - label: "other"

  - type: checkboxes
    id: communication
    attributes:
      label: "Communication"
      description: "체크하면 communication 전체를 교체 | Checking any box replaces the whole list"
      options:
        - label: "ros2"
        - label: "grpc"
        - label: "lcm"
        - label: "zenoh"
        - label: "other"

  - type: input
    id: tags
    attributes:
      label: "Tags"
      description: "쉼표로 구분. 입력하면 tags 전체를 교체 | Comma-separated; replaces the whole tag list"
      placeholder: "e.g. foundation-model, manipulation, diffusion"

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I selected the correct existing model above"
          required: true
        - label: "I filled in only the fields that need to change"
          required: true
