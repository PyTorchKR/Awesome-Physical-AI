name: Process New Entry Issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process:
    if: |
      contains(github.event.issue.labels.*.name, 'add-model') ||
      contains(github.event.issue.labels.*.name, 'add-dataset') ||
      contains(github.event.issue.labels.*.name, 'add-simulator') ||
      contains(github.event.issue.labels.*.name, 'edit-model') ||
      contains(github.event.issue.labels.*.name, 'edit-dataset') ||
      contains(github.event.issue.labels.*.name, 'edit-simulator')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine entry type and action from label
        id: type
        run: |
          LABELS='${{ toJson(github.event.issue.labels.*.name) }}'
          if echo "$LABELS" | grep -qE '"(add|edit)-model"'; then
            echo "issue_type=model" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -qE '"(add|edit)-dataset"'; then
            echo "issue_type=dataset" >> $GITHUB_OUTPUT
          else
            echo "issue_type=tool" >> $GITHUB_OUTPUT
          fi
          if echo "$LABELS" | grep -q '"edit-'; then
            echo "action=edit" >> $GITHUB_OUTPUT
          else
            echo "action=add" >> $GITHUB_OUTPUT
          fi
          # Carry the issue's own label over to the PR. Taken verbatim rather than
          # rebuilt from the pieces above, because the simulator label reads
          # "add-simulator" while the internal type is "tool".
          ENTRY_LABEL=$(echo "$LABELS" | grep -oE '"(add|edit)-(model|dataset|simulator)"' | head -1 | tr -d '"')
          echo "entry_label=$ENTRY_LABEL" >> $GITHUB_OUTPUT

      - name: Parse issue and apply entry
        env:
          ISSUE_BODY:   ${{ github.event.issue.body }}
          ISSUE_TYPE:   ${{ steps.type.outputs.issue_type }}
          ISSUE_ACTION: ${{ steps.type.outputs.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN:     ${{ secrets.HF_TOKEN }}
        run: python scripts/process_issue.py

      - name: Regenerate site data
        run: python scripts/generate_site.py

      # Keep the edit-* forms' ID dropdowns in step with the data, in this same
      # PR — that way a new entry is immediately selectable for later fixes.
      - name: Sync edit-form dropdowns
        run: python scripts/sync_edit_templates.py

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.type.outputs.action }}
          ENTRY_LABEL: ${{ steps.type.outputs.entry_label }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
        run: |
          if [ "$ACTION" = "edit" ]; then
            BRANCH="edit-entry/issue-${ISSUE_NUMBER}"
            COMMIT_SUBJECT="fix: update entry from issue #${ISSUE_NUMBER}"
            PR_TITLE="Update entry: ${ISSUE_TITLE}"
          else
            BRANCH="add-entry/issue-${ISSUE_NUMBER}"
            COMMIT_SUBJECT="feat: add entry from issue #${ISSUE_NUMBER}"
            PR_TITLE="Add entry: ${ISSUE_TITLE}"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/ docs/data.json docs/index.html README.md .github/ISSUE_TEMPLATE
          # Credit the issue author via a Co-authored-by trailer so they are counted
          # as a contributor once the PR is merged (survives squash merges too).
          git commit \
            -m "$COMMIT_SUBJECT" \
            -m "Co-authored-by: ${ISSUE_AUTHOR} <${ISSUE_AUTHOR_ID}+${ISSUE_AUTHOR}@users.noreply.github.com>"
          git push --force origin "$BRANCH"
          PR_BODY=$(printf 'Resolves #%s\n\nAuto-generated from issue by @%s.\n\n**Please review the entry before merging.**' "${ISSUE_NUMBER}" "${ISSUE_AUTHOR}")
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --head "$BRANCH" \
              --base main \
              --label "$ENTRY_LABEL"
          else
            echo "PR #${EXISTING_PR} already exists for this branch — skipping creation"
          fi

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENT=$(printf '✅ 감사합니다! PR이 자동으로 생성되었습니다. 관리자 검토 후 머지됩니다.\n\nThanks! A PR has been automatically created from this issue and is pending admin review.')
          gh issue comment "${ISSUE_NUMBER}" --body "$COMMENT"
