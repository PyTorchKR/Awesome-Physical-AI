name: LLM Metadata Validation

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_llm_metadata.py"
      - "tests/test_validate_llm_metadata.py"
      - ".github/workflows/llm-metadata-validation.yml"
  workflow_dispatch:

jobs:
  validate-llm-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect changed entry IDs
        id: changed-ids
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          ENTRY_IDS="$(python scripts/changed_entry_ids.py --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          echo "entry_ids=${ENTRY_IDS}" >> "$GITHUB_OUTPUT"

      - name: Skip when no metadata entries changed
        if: github.event_name == 'pull_request' && steps.changed-ids.outputs.entry_ids == ''
        run: |
          mkdir -p reports
          cat <<EOF > reports/llm_validation_report.json
          {"status":"skipped","skipped_reason":"No metadata entries changed in this PR.","counts":{"pass":0,"warning":0,"fail":0},"results":[]}
          EOF
          cat <<EOF > reports/llm_validation_summary.md
          # LLM Metadata Validation
          - Status: \`skipped\`
          - Pass: \`0\`
          - Warning: \`0\`
          - Fail: \`0\`
          - Skipped reason: No metadata entries changed in this PR.
          EOF

      - name: Run LLM metadata validation
        if: github.event_name != 'pull_request' || steps.changed-ids.outputs.entry_ids != ''
        run: >
          python scripts/validate_llm_metadata.py
          --entry-ids "${{ steps.changed-ids.outputs.entry_ids }}"
          --output reports/llm_validation_report.json
          --summary-output reports/llm_validation_summary.md

      - name: Comment validation result on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summary = fs.readFileSync("reports/llm_validation_summary.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const pr = context.payload.pull_request;
            // A new PR head needs a new comment so @mentioning the issue
            // author also notifies them of the re-validation result. Reruns
            // for the same head continue to update that one comment.
            const marker = `<!-- llm-metadata-validation-comment:${pr.head.sha} -->`;
            let mention = pr.user.login;

            const issueMatch = pr.body?.match(/Resolves #(\d+)/);
            if (issueMatch) {
              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: Number(issueMatch[1]),
              });
              mention = issue.data.user.login;
            }

            const body = `${marker}\n@${mention}\n\n${summary}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
              core.info(`Updated validation comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
              core.info(`Created validation comment: ${created.data.id}`);
            }

